<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visited - WanderVibe</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-mode.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

    <!-- HEADER -->
    <header id="header">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">🌍</span>
                <span class="logo-text">WanderVibe</span>
            </div>

            <nav id="navbar">
                <a href="index.html">Home</a>
                <a href="destinations.html">Destinations</a>
                <a href="favorites.html">Favorites</a>
                <a href="visited.html" class="active">Visited</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>

            <div class="header-controls">
                <button id="theme-toggle" aria-label="Toggle Theme">🌙</button>
                <button id="menu-toggle" aria-label="Menu">☰</button>
            </div>
        </div>
    </header>

    <!-- VISITED -->
    <section id="visited-page">
        <div class="container">
            <div class="section-header">
                <h2>Places You've Visited</h2>
                <p>Track your travel journey</p>
            </div>
            <div id="visited-grid" class="destinations-grid"></div>
            <div id="visited-empty" class="empty-state">
                <div class="empty-icon">✈️</div>
                <h3>No Visited Places Yet</h3>
                <p>Mark destinations as visited when you've been there!</p>
                <a href="destinations.html" class="btn btn-primary">Explore Now</a>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <button id="back-to-top" aria-label="Back to top">↑</button>

    <script src="js/main.js"></script>
    <script src="js/theme-switcher.js"></script>
    <script src="js/destinations.js"></script>
    <script src="js/visited.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
