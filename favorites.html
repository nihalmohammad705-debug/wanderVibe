<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorites - WanderVibe</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-mode.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="icon" type="image/png" href="assets/images/wandervibelogo.png" />
</head>
<body>

    <!-- HEADER -->
    <header id="header">
        <div class="container">
            <div class="logo">
                <span class="logo-text">WanderVibe</span>
            </div>

            <nav id="navbar">
                <a href="index.html">Home</a>
                <a href="destinations.html">Destinations</a>
                <a href="favorites.html" class="active">Favorites</a>
                <a href="visited.html">Visited</a>
                <a href="about.html">About</a>
                <a href="documentation.html">Documentation</a>
                <a href="contact.html">Contact</a>
            </nav>

            <div class="header-controls">
                <button id="theme-toggle" aria-label="Toggle Theme">🌙</button>
                <button id="menu-toggle" aria-label="Menu">☰</button>
            </div>
        </div>
    </header>

    <!-- LOADING SCREEN -->
    <div id="loader">
        <div class="loader-content">
            <img src="assets/images/wandervibelogo.png" alt="WanderVibe" style="height:170px;width:auto;margin-bottom:3px;" />
            <div class="loader-text">WanderVibe</div>
            <div class="loader-bar"><div class="loader-progress"></div></div>
        </div>
    </div>

    <!-- FAVORITES  -->
    <section id="favorites-page">
        <div class="container">
            <div class="section-header">
                <h2>Your Favorites</h2>
                <p>Places you've saved for future adventures</p>
            </div>
            <div id="favorites-grid" class="destinations-grid"></div>
            <div id="favorites-empty" class="empty-state">
                <div class="empty-icon">🗺️</div>
                <h3>No Favorites Yet</h3>
                <p>Start exploring destinations and save your favorites!</p>
                <a href="destinations.html" class="btn btn-primary">Explore Now</a>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <button id="back-to-top" aria-label="Back to top">↑</button>

    <script src="js/main.js"></script>
    <script src="js/theme-switcher.js"></script>
    <script src="js/destinations.js"></script>
    <script src="js/favorites.js"></script>
    <script src="js/footer.js"></script>

</body>
</html>
