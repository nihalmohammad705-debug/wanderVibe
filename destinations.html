<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Destinations - WanderVibe</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-mode.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="icon" type="image/png" href="assets/images/wandervibelogo.png" />
</head>
<body>

    <!-- HEADER -->
    <header id="header">
        <div class="container">
            <div class="logo">
                <span class="logo-text">WanderVibe</span>
            </div>

            <nav id="navbar">
                <a href="index.html">Home</a>
                <a href="destinations.html" class="active">Destinations</a>
                <a href="favorites.html">Favorites</a>
                <a href="visited.html">Visited</a>
                <a href="about.html">About</a>
                <a href="documentation.html">Documentation</a>
                <a href="contact.html">Contact</a>
            </nav>

            <div class="header-controls">
                <button id="search-toggle" aria-label="Search">🔍</button>
                <button id="theme-toggle" aria-label="Toggle Theme">🌙</button>
                <button id="menu-toggle" aria-label="Menu">☰</button>
            </div>
        </div>
    </header>

    <!-- LOADING SCREEN -->
    <div id="loader">
        <div class="loader-content">
            <img src="assets/images/wandervibelogo.png" alt="WanderVibe" style="height:170px;width:auto;margin-bottom:3px;" />
            <div class="loader-text">WanderVibe</div>
            <div class="loader-bar"><div class="loader-progress"></div></div>
        </div>
    </div>

    <!-- SEARCH OVERLAY -->
    <div id="search-overlay">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search destinations by name, country, or category..." />
            <button id="search-close">✕</button>
        </div>
        <div id="search-results"></div>
    </div>

    <!-- DESTINATIONS -->
    <section id="destinations-page">
        <div class="container">
            <div class="section-header">
                <h2>Explore All Destinations</h2>
                <p>Discover amazing places around the world</p>
            </div>

            <div class="category-filters">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="Beach">🏖️ Beach</button>
                <button class="filter-btn" data-category="Adventure">🏔️ Adventure</button>
                <button class="filter-btn" data-category="Cultural">🏛️ Cultural</button>
                <button class="filter-btn" data-category="City">🌆 City</button>
            </div>

            <div id="destination-grid" class="destinations-grid"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <button id="back-to-top" aria-label="Back to top">↑</button>

    <script src="js/main.js"></script>
    <script src="js/theme-switcher.js"></script>
    <script src="js/destinations.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
